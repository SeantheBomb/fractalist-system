name = "fractalist-system"
compatibility_date = "2026-08-01"
pages_build_output_dir = "dist"

# Analytics Engine dataset names must be [A-Za-z0-9_], so the hyphenated
# form isn't accepted — underscores instead.
[[analytics_engine_datasets]]
binding = "FRACTALISM_TELEMETRY"
dataset = "fractalism_telemetry"
